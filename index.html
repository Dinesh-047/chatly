  /* ============================================================
     HTML ESCAPE
     ============================================================ */

  function escapeHTML(text) {
    return String(text == null ? "" : text).replace(
      /[&<>"']/g,
      function (character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character];
      }
    );
  }

  /* ============================================================
     USERNAME
     ============================================================ */

  function cleanUsername(value) {
    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/^@/, "");
  }

  /* ============================================================
     CHAT ROOM
     ============================================================ */

  function chatRoomId(uid1, uid2) {
    return [uid1, uid2].sort().join("_");

  /* ============================================================
     TIME
     ============================================================ */

  function formatTime(timestamp) {

    if (
      timestamp &&
      typeof timestamp.toDate === "function"
    ) {
      return timestamp.toDate().toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

    return "Sending...";
  }

  /* ============================================================
     BASE64 HELPERS
     ============================================================ */

  function uint8ToBase64(array) {

    var binary = "";

    for (var i = 0; i < array.length; i++) {
      binary += String.fromCharCode(array[i]);
    }

    return btoa(binary);
  }

  function base64ToUint8(value) {

    var binary = atob(value);

    var result = new Uint8Array(
      binary.length
    );

    for (var i = 0; i < binary.length; i++) {
      result[i] = binary.charCodeAt(i);
    }

    return result;
  }

  /* ============================================================
     IMPORTANT DECRYPTION FIX
     ------------------------------------------------------------
     OLD SYSTEM:
     ECDH keys were stored in localStorage.
     Different browser/device = different private key.
     Result = [Unable to decrypt]

     NEW SYSTEM:
     Both users derive the same AES key from both Firebase UIDs.
     Therefore both sides can decrypt the same chat messages.
     ============================================================ */

  async function getSharedChatKey() {

    if (!currentUser) {
      throw new Error("User is not logged in.");
    }

    if (!selectedUser) {
      throw new Error("Please select a user.");
    }

    var values = [
      "CHATLY_SHARED_KEY_V4",
      currentUser.uid,
      selectedUser.uid
    ];

    values.sort();

    var rawString = values.join("|");

    var rawData = new TextEncoder().encode(
      rawString
    );

    var hash = await crypto.subtle.digest(
      "SHA-256",
      rawData
    );

    return crypto.subtle.importKey(
      "raw",
      hash,
      {
        name: "AES-GCM"
      },
      false,
      [
        "encrypt",
        "decrypt"
      ]
    );
  }

  /* ============================================================
     ENCRYPT MESSAGE
     ============================================================ */

  async function encryptMessage(message) {

    var key = await getSharedChatKey();

    var iv = crypto.getRandomValues(
      new Uint8Array(12)
    );

    var encoded = new TextEncoder().encode(
      message
    );

    var encrypted = await crypto.subtle.encrypt(
      {
        name: "AES-GCM",
        iv: iv
      },
      key,
      encoded
    );

    return {
      iv: uint8ToBase64(iv),
      cipher: uint8ToBase64(
        new Uint8Array(encrypted)
      )
    };
  }

  /* ============================================================
     DECRYPT MESSAGE
     ============================================================ */

  async function decryptMessage(iv, cipher) {

    if (!iv || !cipher) {
      throw new Error(
        "Invalid encrypted message."
      );
    }

    var key = await getSharedChatKey();

    var decrypted = await crypto.subtle.decrypt(
      {
        name: "AES-GCM",
        iv: base64ToUint8(iv)
      },
      key,
      base64ToUint8(cipher)
    );

    return new TextDecoder().decode(
      decrypted
    );
  }

  /* ============================================================
     FILE TYPE
     ============================================================ */

  function getFileKind(file) {

    var type = file.type || "";

    if (type.indexOf("image/") === 0) {
      return "image";
    }

    if (type.indexOf("video/") === 0) {
      return "video";
    }

    if (type.indexOf("audio/") === 0) {
      return "audio";
    }

    return "file";
  }

  /* ============================================================
     FILE TO DATA URL
     ------------------------------------------------------------
     Firestore document limit is about 1 MiB.
     We keep practical limit around 650 KB.
     ============================================================ */

  function fileToDataURL(file) {

    return new Promise(function (resolve, reject) {

      if (file.size > 650 * 1024) {

        reject(
          new Error(
            "File too large. Maximum supported size is about 650 KB."
          )
        );

        return;
      }

      var reader = new FileReader();

      reader.onload = function () {
        resolve(reader.result);
      };

      reader.onerror = function () {
        reject(
          new Error(
            "Unable to read the file."
          )
        );
      };

      reader.readAsDataURL(file);
    });
  }

  /* ============================================================
     RENDER ATTACHMENT
     ============================================================ */

  function renderAttachment(attachment) {

    if (!attachment) {
      return "";
    }

    var url = escapeHTML(
      attachment.url || ""
    );

    var name = escapeHTML(
      attachment.name || "Attachment"
    );

    var kind = attachment.kind || "file";

    if (kind === "image") {

      return (
        "<a class='pm-attachment' " +
        "href='" + url + "' " +
        "target='_blank' " +
        "rel='noopener'>" +

        "<img src='" + url + "' " +
        "alt='" + name + "'/>" +

        "</a>"
      );
    }

    if (kind === "video") {

      return (
        "<video " +
        "class='pm-attachment' " +
        "controls='controls' " +
        "preload='metadata' " +
        "src='" + url + "'>" +
        "</video>"
      );
    }

    if (kind === "audio") {

      return (
        "<audio " +
        "class='pm-audio' " +
        "controls='controls' " +
        "preload='metadata' " +
        "src='" + url + "'>" +
        "</audio>"
      );
    }

    return (
      "<a class='pm-attachment pm-file' " +
      "href='" + url + "' " +
      "download='" + name + "'>" +

      "📎 " + name +

      "</a>"
    );
  }

  /* ============================================================
     PROFILE
     ============================================================ */

  async function createUserProfile(user) {

    var userRef =
      db.collection("users")
        .doc(user.uid);

    var snapshot =
      await userRef.get();

    if (snapshot.exists) {
      return snapshot.data();
    }

    var name =
      ($("PM_NAME") &&
       $("PM_NAME").value.trim()) ||
      "User";

    var baseUsername =
      cleanUsername(name)
        .replace(/[^a-z0-9_]/g, "")
        .slice(0, 18);

    if (!baseUsername) {
      baseUsername = "user";
    }

    var username = baseUsername;

    var attempt = 0;

    while (attempt < 10) {

      var query =
        await db.collection("users")
          .where(
            "username",
            "==",
            username
          )
          .limit(1)
          .get();

      if (query.empty) {
        break;
      }

      attempt++;

      username =
        baseUsername +
        Math.floor(
          100 +
          Math.random() * 900
        );
    }

    var profile = {

      uid: user.uid,

      email:
        user.email || "",

      name: name,

      username: username,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()
    };

    await userRef.set(profile);

    return profile;
  }

  async function getProfile(uid) {

    var snapshot =
      await db.collection("users")
        .doc(uid)
        .get();

    if (!snapshot.exists) {
      return null;
    }

    return snapshot.data();
  }

    var snapshot =
      await db.collection("users")
        .where(
          "username",
          "==",
          username
        )
        .limit(1)
        .get();

    if (snapshot.empty) {
      return null;
    }

    return snapshot.docs[0].data();

    if (contactUnsubscribe) {
      contactUnsubscribe();

    contactUnsubscribe =
      db.collection("users")
        .doc(currentUser.uid)
        .collection("contacts")
        .onSnapshot(

            if (!$("PM_CHAT_LIST")) {
              return;

            $("PM_CHAT_LIST")
              .innerHTML = "";

            for (
              var i = 0;
              i < snapshot.docs.length;
              i++
            ) {

              var contact =
                snapshot.docs[i].data();

              var user =
                await getProfile(
                  contact.uid

              if (!user) {
                continue;
              }

              var item =
                document.createElement(
                  "div"

              item.className =

              item.innerHTML =

                escapeHTML(
                  user.username ||
                  ""

                "</small>";

              item.onclick =
                (function (selected) {

                  return function () {
                    openChat(selected);
                  };

                })(user);

              $("PM_CHAT_LIST")
                .appendChild(item);
            }
          }
        );
  }

  /* ============================================================

    selectedUser = user;

    if ($("PM_MAIN_APP")) {
      $("PM_MAIN_APP")
        .classList
        .add("pm-chat-open");
    }

    if ($("PM_PEER_NAME")) {
      $("PM_PEER_NAME").textContent =

      $("PM_PEER_STATUS").textContent =

    }

    if ($("PM_AVATAR")) {
      $("PM_AVATAR").textContent =
        (user.name || "U")
          .charAt(0)
          .toUpperCase();
    }

    loadMessages();
  }

  /* ============================================================
     MESSAGE BUBBLE
     ============================================================ */

  function createMessageBubble(
    message,
    text
  ) {

    var bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "pm-message " +
      (
        message.from ===
        currentUser.uid
          ? "pm-mine"
          : ""
      );

    var body =
      escapeHTML(
        text || ""
      );

    if (message.attachment) {

      body +=
        renderAttachment(
          message.attachment
        );
    }

    var ticks = "";

    if (
      message.from ===
      currentUser.uid
    ) {

      ticks =
        message.read
          ? " ✓✓"
          : " ✓";
    }

    body +=
      "<div class='pm-time'>" +
      formatTime(
        message.createdAt
      ) +
      ticks +
      "</div>";

    bubble.innerHTML =
      body;

    return bubble;
  }

  /* ============================================================
     MARK MESSAGES READ
     ============================================================ */

  async function markMessagesRead() {

    if (!selectedUser) {
      return;
    }

    try {

      var room =
        chatRoomId(
          currentUser.uid,
          selectedUser.uid
        );

      var snapshot =
        await db
          .collection("chats")
          .doc(room)
          .collection("messages")
          .where(
            "from",
            "==",
            selectedUser.uid
          )
          .get();

      if (snapshot.empty) {
        return;
      }

      var batch =
        db.batch();

      snapshot.forEach(
        function (doc) {

          var data =
            doc.data();

          if (!data.read) {

            batch.update(
              doc.ref,
              {
                read: true
              }
            );
          }
        }
      );

      await batch.commit();

    } catch (error) {
      /* Ignore read receipt errors */
    }
  }

  /* ============================================================
     LOAD MESSAGES
     ============================================================ */

  function loadMessages() {

    if (messageUnsubscribe) {
      messageUnsubscribe();
      messageUnsubscribe = null;
    }

    if (!selectedUser) {
      return;
    }

    var room =
      chatRoomId(
        currentUser.uid,
        selectedUser.uid
      );

    messageUnsubscribe =
      db.collection("chats")
        .doc(room)
        .collection("messages")
        .orderBy(
          "createdAt",
          "asc"
        )
        .onSnapshot(
          async function (snapshot) {

            if (!$("PM_MESSAGES")) {
              return;
            }

            $("PM_MESSAGES")
              .innerHTML = "";

            for (
              var i = 0;
              i < snapshot.docs.length;
              i++
            ) {

              var message =
                snapshot.docs[i].data();

              var text = "";

              if (
                message.iv &&
                message.cipher
              ) {

                try {

                  text =
                    await decryptMessage(
                      message.iv,
                      message.cipher
                    );

                } catch (error) {

                  /*
                   * This should only happen
                   * for old messages created
                   * by the broken encryption
                   * version.
                   */

                  text =
                    "[Old message cannot be decrypted]";
                }

              } else if (
                message.text
              ) {

                text =
                  message.text;
              }

              var bubble =
                createMessageBubble(
                  message,
                  text
                );

              $("PM_MESSAGES")
                .appendChild(
                  bubble
                );
            }

            $("PM_MESSAGES")
              .scrollTop =
              $("PM_MESSAGES")
                .scrollHeight;

            markMessagesRead();
          }
        );
  }

  /* ============================================================
     SAVE MESSAGE
     ============================================================ */

  async function saveMessage(
    text,
    attachment
  ) {

    if (!selectedUser) {

      toast(
        "Select a chat first."
      );

      return;
    }

    var room =
      chatRoomId(
        currentUser.uid,
        selectedUser.uid
      );

    var data = {

      from:
        currentUser.uid,

      createdAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp(),

      read: false
    };

    if (text) {

      var encrypted =
        await encryptMessage(
          text
        );

      data.iv =
        encrypted.iv;

      data.cipher =
        encrypted.cipher;
    }

    if (attachment) {
      data.attachment =
        attachment;
    }

    await db
      .collection("chats")
      .doc(room)
      .collection("messages")
      .add(data);
  }

  /* ============================================================
     SEND TEXT
     ============================================================ */

  async function sendMessage() {

    if (!$("PM_MESSAGE")) {
      return;
    }

    var text =
      $("PM_MESSAGE")
        .value
        .trim();

    if (!text) {
      return;
    }

    try {

      await saveMessage(
        text,
        null
      );

      $("PM_MESSAGE")
        .value = "";

    } catch (error) {

      toast(error.message);
    }
  }

  if ($("PM_SEND")) {

    $("PM_SEND").onclick =
      sendMessage;
  }

  if ($("PM_MESSAGE")) {

    $("PM_MESSAGE").onkeydown =
      function (event) {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          sendMessage();
        }
      };
  }

  /* ============================================================
     ATTACHMENT UI
     ============================================================ */

  function createAttachmentUI() {

    if (!$("PM_MESSAGE")) {
      return;
    }

    if (!$("PM_FILE")) {

      var fileInput =
        document.createElement(
          "input"
        );

      fileInput.type =
        "file";

      fileInput.id =
        "PM_FILE";

      fileInput.accept =
        "image/*,audio/*,video/*,.pdf,.doc,.docx,.txt,.zip";

      fileInput.style.display =
        "none";

      document.body.appendChild(
        fileInput
      );
    }

    if (!$("PM_ATTACH")) {

      var attachButton =
        document.createElement(
          "button"
        );

      attachButton.id =
        "PM_ATTACH";

      attachButton.type =
        "button";

      attachButton.className =
        "pm-tool";

      attachButton.innerHTML =
        "📎";

      attachButton.title =
        "Attachment";

      var composer =
        $("PM_MESSAGE")
          .parentElement;

      composer.insertBefore(
        attachButton,
        $("PM_MESSAGE")
      );
    }

    $("PM_ATTACH").onclick =
      function () {

        $("PM_FILE").click();
      };

    $("PM_FILE").onchange =
      async function () {

        var file =
          this.files[0];

        this.value = "";

        if (!file) {
          return;
        }

        if (!selectedUser) {

          toast(
            "Select a chat first."
          );

          return;
        }

        try {

          var url =
            await fileToDataURL(
              file
            );

          var attachment = {

            name:
              file.name,

            mime:
              file.type,

            kind:
              getFileKind(file),

            url:
              url,

            size:
              file.size
          };

          await saveMessage(
            "",
            attachment
          );

          toast(
            "Attachment sent."
          );

        } catch (error) {

          toast(
            error.message
          );
        }
      };
  }

  /* ============================================================
     VOICE NOTE
     ============================================================ */

  function createVoiceButton() {

    if (!$("PM_MESSAGE")) {
      return;
    }

    if (!$("PM_VOICE_NOTE")) {

      var button =
        document.createElement(
          "button"
        );

      button.id =
        "PM_VOICE_NOTE";

      button.type =
        "button";

      button.className =
        "pm-tool";

      button.innerHTML =
        "🎙️";

      button.title =
        "Voice Note";

      var composer =
        $("PM_MESSAGE")
          .parentElement;

      composer.insertBefore(
        button,
        $("PM_MESSAGE")
      );
    }

    $("PM_VOICE_NOTE").onclick =
      async function () {

        if (!selectedUser) {

          toast(
            "Select a chat first."
          );

          return;
        }

        if (
          voiceRecorder &&
          voiceRecorder.state ===
          "recording"
        ) {

          voiceRecorder.stop();

          return;
        }

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          toast(
            "Voice recording is not supported in this browser."
          );

          return;
        }

        try {

          var stream =
            await navigator
              .mediaDevices
              .getUserMedia({
                audio: true
              });

          voiceChunks = [];

          var mime =
            "audio/webm";

          if (
            !MediaRecorder.isTypeSupported(
              "audio/webm"
            )
          ) {

            mime =
              "audio/mp4";
          }

          voiceRecorder =
            new MediaRecorder(
              stream,
              {
                mimeType: mime
              }
            );

          voiceRecorder.ondataavailable =
            function (event) {

              if (
                event.data &&
                event.data.size
              ) {

                voiceChunks.push(
                  event.data
                );
              }
            };

          voiceRecorder.onstop =
            async function () {

              stream
                .getTracks()
                .forEach(
                  function (track) {
                    track.stop();
                  }
                );

              try {

                var blob =
                  new Blob(
                    voiceChunks,
                    {
                      type: mime
                    }
                  );

                if (
                  blob.size >
                  650 * 1024
                ) {

                  toast(
                    "Voice note is too long. Keep it short."
                  );

                  return;
                }

                var extension =
                  mime.indexOf(
                    "mp4"
                  ) !== -1
                    ? "m4a"
                    : "webm";

                var file =
                  new File(
                    [
                      blob
                    ],
                    "voice-note." +
                    extension,
                    {
                      type: mime
                    }
                  );

                var url =
                  await fileToDataURL(
                    file
                  );

                var attachment = {

                  name:
                    "Voice note",

                  mime:
                    mime,

                  kind:
                    "audio",

                  url:
                    url,

                  size:
                    blob.size
                };

                await saveMessage(
                  "",
                  attachment
                );

                toast(
                  "Voice note sent."
                );

              } catch (error) {

                toast(
                  error.message
                );
              }

              if ($("PM_VOICE_NOTE")) {

                $("PM_VOICE_NOTE")
                  .classList
                  .remove(
                    "pm-voice-recording"
                  );
              }

              voiceRecorder =
                null;

              voiceChunks = [];
            };

          voiceRecorder.start();

          $("PM_VOICE_NOTE")
            .classList
            .add(
              "pm-voice-recording"
            );

          toast(
            "Recording... tap mic again to send."
          );

        } catch (error) {

          toast(
            "Microphone permission required."
          );
        }
      };
  }

     STATUS BUTTON

    }

  /* ============================================================
     STATUS PANEL
     ============================================================ */

  function openStatusPanel() {

    var panel =
      $("PM_STATUS_PANEL");

    if (!panel) {

      panel =
        document.createElement(
          "section"
        );

      panel.id =
        "PM_STATUS_PANEL";

      panel.className =
        "pm-status-panel";

      panel.innerHTML =
        "<div class='pm-status-card'>" +

        "<div style='display:flex;justify-content:space-between;align-items:center'>" +

        "<strong>My Status</strong>" +

        "<button id='PM_STATUS_CLOSE' class='pm-icon' type='button'>✕</button>" +

        "</div>" +

        "<div id='PM_STATUS_LIST' style='margin-top:15px'></div>" +

        "<div style='margin-top:15px'>" +

        "<input id='PM_STATUS_FILE' type='file' accept='image/*,video/*' style='display:none'/>" +

        "<button id='PM_ADD_STATUS' class='pm-primary' type='button'>Add Status</button>" +

        "</div>" +

        "</div>";

      $("PM_APP")
        .appendChild(panel);

      $("PM_STATUS_CLOSE").onclick =
        function () {

          panel.classList.add(
            "pm-hidden"
          );
        };

      $("PM_ADD_STATUS").onclick =
        function () {

          $("PM_STATUS_FILE")
            .click();
        };

      $("PM_STATUS_FILE").onchange =
        async function () {

          var file =
            this.files[0];

          this.value = "";

          if (!file) {
            return;
          }

          try {

            if (
              file.size >
              650 * 1024
            ) {

              throw new Error(
                "Status file must be under 650 KB."
              );
            }

            var url =
              await fileToDataURL(
                file
              );

            await db
              .collection("users")
              .doc(currentUser.uid)
              .collection("statuses")
              .add({

                name:
                  myProfile.name,

                username:
                  myProfile.username,

                kind:
                  file.type.indexOf(
                    "video/"
                  ) === 0
                    ? "video"
                    : "image",

                url:
                  url,

                createdAt:
                  firebase.firestore
                    .FieldValue
                    .serverTimestamp()
              });

            toast(
              "Status uploaded."
            );

            loadMyStatuses();

          } catch (error) {

            toast(
              error.message
            );
          }
        };
    }

    panel.classList.remove(
      "pm-hidden"
    );

    loadMyStatuses();
  }

  /* ============================================================
     LOAD MY STATUS
     ============================================================ */

  async function loadMyStatuses() {

    if (!currentUser) {
      return;
    }

    var list =
      $("PM_STATUS_LIST");

    if (!list) {
      return;
    }

    list.innerHTML =
      "<div class='pm-status'>Loading...</div>";

    try {

      var snapshot =
        await db
          .collection("users")
          .doc(currentUser.uid)
          .collection("statuses")
          .orderBy(
            "createdAt",
            "desc"
          )
          .limit(20)
          .get();

      list.innerHTML = "";

      if (snapshot.empty) {

        list.innerHTML =
          "<div class='pm-status'>No status yet.</div>";

        return;
      }

      snapshot.forEach(
        function (doc) {

          var status =
            doc.data();

          var item =
            document.createElement(
              "div"
            );

          item.className =
            "pm-story";

          var media = "";

          if (
            status.kind ===
            "video"
          ) {

            media =
              "<video controls='controls' src='" +
              escapeHTML(
                status.url
              ) +
              "'></video>";

          } else {

            media =
              "<img src='" +
              escapeHTML(
                status.url
              ) +
              "' alt='Status'/>";
          }

          item.innerHTML =
            "<strong>" +
            escapeHTML(
              status.name ||
              "My Status"
            ) +
            "</strong>" +

            "<small> " +
            formatTime(
              status.createdAt
            ) +
            "</small>" +

            media;

          list.appendChild(
            item
          );
        }
      );

    } catch (error) {

      list.innerHTML =
        "<div class='pm-status'>" +
        escapeHTML(
          error.message
        ) +
        "</div>";
    }
  }

  /* ============================================================
     WEBRTC
     ============================================================ */

  function createPeerConnection() {

    var connection =
      new RTCPeerConnection({

        iceServers: [
          {
            urls:
              "stun:stun.l.google.com:19302"
          }
        ]
      });

    connection.ontrack =
      function (event) {

        if ($("PM_REMOTE_VIDEO")) {

          $("PM_REMOTE_VIDEO")
            .srcObject =
            event.streams[0];
        }
      };

    connection.onconnectionstatechange =
      function () {

        if (
          connection.connectionState ===
          "connected"
        ) {

          $("PM_CALL_STATUS")
            .textContent =
            "Connected";

          /*
           * FIX:
           * Connected text automatically
           * disappears after 2.5 seconds.
           */

          setTimeout(
            function () {

              if (
                $("PM_CALL_STATUS") &&
                $("PM_CALL_STATUS")
                  .textContent ===
                "Connected"
              ) {

                $("PM_CALL_STATUS")
                  .textContent = "";
              }

            },
            2500
          );
        }

        if (
          connection.connectionState ===
          "failed"
        ) {

          $("PM_CALL_STATUS")
            .textContent =
            "Connection failed";
        }

        if (
          connection.connectionState ===
          "disconnected"
        ) {

          $("PM_CALL_STATUS")
            .textContent =
            "";
        }
      };

    return connection;
  }

  /* ============================================================
     START CALL
     ============================================================ */

  async function startCall(
    video
  ) {

    if (!selectedUser) {

      toast(
        "Select a user first."
      );

      return;
    }

    try {

      callIsVideo =
        video;

      $("PM_CALL")
        .classList
        .remove(
          "pm-hidden"
        );

      $("PM_CALL_TITLE")
        .textContent =
        video
          ? "Video Call"
          : "Voice Call";

      $("PM_CALL_STATUS")
        .textContent =
        "Calling...";

      localStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            audio: true,

            video: video
          });

      $("PM_LOCAL_VIDEO")
        .srcObject =
        localStream;

      $("PM_LOCAL_VIDEO")
        .style.display =
        video
          ? "block"
          : "none";

      peerConnection =
        createPeerConnection();

      localStream
        .getTracks()
        .forEach(
          function (track) {

            peerConnection
              .addTrack(
                track,
                localStream
              );
          }
        );

      currentCallId =
        crypto.randomUUID();

      peerConnection.onicecandidate =
        async function (event) {

          if (
            event.candidate
          ) {

            await db
              .collection("calls")
              .doc(currentCallId)
              .collection(
                "callerCandidates"
              )
              .add(
                event.candidate
                  .toJSON()
              );
          }
        };

      var offer =
        await peerConnection
          .createOffer();

      await peerConnection
        .setLocalDescription(
          offer
        );

      await db
        .collection("calls")
        .doc(currentCallId)
        .set({

          caller:
            currentUser.uid,

          callee:
            selectedUser.uid,

          callerName:
            myProfile.name,

          video:
            video,

          offer: {

            type:
              offer.type,

            sdp:
              offer.sdp
          },

          status:
            "ringing",

          createdAt:
            firebase.firestore
              .FieldValue
              .serverTimestamp()
        });

      callStatusUnsubscribe =
        db.collection("calls")
          .doc(currentCallId)
          .onSnapshot(
            async function (snapshot) {

              var data =
                snapshot.data();

              if (!data) {
                return;
              }

              if (
                data.answer &&
                peerConnection &&
                !peerConnection
                  .currentRemoteDescription
              ) {

                await peerConnection
                  .setRemoteDescription(
                    new RTCSessionDescription(
                      data.answer
                    )
                  );
              }

              if (
                data.status ===
                  "ended" ||
                data.status ===
                  "declined"
              ) {

                endCall(false);
              }
            }
          );

      db.collection("calls")
        .doc(currentCallId)
        .collection(
          "calleeCandidates"
        )
        .onSnapshot(
          function (snapshot) {

            snapshot
              .docChanges()
              .forEach(
                async function (change) {

                  if (
                    change.type ===
                      "added" &&
                    peerConnection
                  ) {

                    try {

                      await peerConnection
                        .addIceCandidate(
                          new RTCIceCandidate(
                            change.doc.data()
                          )
                        );

                    } catch (error) {}
                  }
                }
              );
          }
        );

    } catch (error) {

      toast(
        error.message
      );

      endCall(false);
    }
  }

  /* ============================================================
     INCOMING CALLS
     ============================================================ */

  function listenForIncomingCalls() {

    if (incomingCallUnsubscribe) {
      incomingCallUnsubscribe();
    }

    incomingCallUnsubscribe =
      db.collection("calls")
        .where(
          "callee",
          "==",
          currentUser.uid
        )
        .where(
          "status",
          "==",
          "ringing"
        )
        .onSnapshot(
          function (snapshot) {

            snapshot
              .docChanges()
              .forEach(
                function (change) {

                  if (
                    change.type !==
                    "added"
                  ) {
                    return;
                  }

                  var call =
                    change.doc.data();

                  var caller =
                    call.callerName ||
                    "Someone";

                  var callType =
                    call.video
                      ? "Video"
                      : "Voice";

                  var accept =
                    confirm(
                      caller +
                      " se " +
                      callType +
                      " call aa rahi hai.\n\nAccept?"
                    );

                  if (accept) {

                    acceptCall(
                      change.doc.id,
                      call
                    );

                  } else {

                    db.collection(
                      "calls"
                    )
                      .doc(
                        change.doc.id
                      )
                      .update({
                        status:
                          "declined"
                      })
                      .catch(
                        function () {}
                      );
                  }
                }
              );
          }
        );
  }

  /* ============================================================
     ACCEPT CALL
     ============================================================ */

  async function acceptCall(
    callId,
    call
  ) {

    try {

      currentCallId =
        callId;

      callIsVideo =
        !!call.video;

      $("PM_CALL")
        .classList
        .remove(
          "pm-hidden"
        );

      $("PM_CALL_TITLE")
        .textContent =
        call.video
          ? "Video Call"
          : "Voice Call";

      $("PM_CALL_STATUS")
        .textContent =
        "Connecting...";

      localStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            audio: true,

            video:
              !!call.video
          });

      $("PM_LOCAL_VIDEO")
        .srcObject =
        localStream;

      $("PM_LOCAL_VIDEO")
        .style.display =
        call.video
          ? "block"
          : "none";

      peerConnection =
        createPeerConnection();

      localStream
        .getTracks()
        .forEach(
          function (track) {

            peerConnection
              .addTrack(
                track,
                localStream
              );
          }
        );

      peerConnection.onicecandidate =
        async function (event) {

          if (
            event.candidate
          ) {

            await db
              .collection("calls")
              .doc(callId)
              .collection(
                "calleeCandidates"
              )
              .add(
                event.candidate
                  .toJSON()
              );
          }
        };

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            call.offer
          )
        );

      var answer =
        await peerConnection
          .createAnswer();

      await peerConnection
        .setLocalDescription(
          answer
        );

      await db
        .collection("calls")
        .doc(callId)
        .update({

          answer: {

            type:
              answer.type,

            sdp:
              answer.sdp
          },

          status:
            "accepted"
        });

      callStatusUnsubscribe =
        db.collection("calls")
          .doc(callId)
          .onSnapshot(
            function (snapshot) {

              var data =
                snapshot.data();

              if (
                data &&
                data.status ===
                "ended"
              ) {

                endCall(false);
              }
            }
          );

      db.collection("calls")
        .doc(callId)
        .collection(
          "callerCandidates"
        )
        .onSnapshot(
          function (snapshot) {

            snapshot
              .docChanges()
              .forEach(
                async function (change) {

                  if (
                    change.type ===
                      "added" &&
                    peerConnection
                  ) {

                    try {

                      await peerConnection
                        .addIceCandidate(
                          new RTCIceCandidate(
                            change.doc.data()
                          )
                        );

                    } catch (error) {}
                  }
                }
              );
          }
        );

    } catch (error) {

      toast(
        error.message
      );

      endCall(false);
    }
  }

  /* ============================================================
     CALL BUTTONS
     ============================================================ */

  if ($("PM_VOICE")) {

    $("PM_VOICE").onclick =
      function () {

        startCall(false);
      };
  }

  if ($("PM_VIDEO")) {

    $("PM_VIDEO").onclick =
      function () {

        startCall(true);
      };
  }

  /* ============================================================
     END CALL
     ============================================================ */

  async function endCall(
    updateFirebase
  ) {

    var callId =
      currentCallId;

    if (callStatusUnsubscribe) {

      callStatusUnsubscribe();

      callStatusUnsubscribe =
        null;
    }

    if (
      updateFirebase &&
      callId
    ) {

      try {

        await db
          .collection("calls")
          .doc(callId)
          .update({

            status:
              "ended"
          });

      } catch (error) {}
    }

    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          function (track) {

            track.stop();
          }
        );
    }

    if (peerConnection) {

      try {
        peerConnection.close();
      } catch (error) {}
    }

    localStream = null;

    peerConnection = null;

    currentCallId = null;

    if ($("PM_REMOTE_VIDEO")) {

      $("PM_REMOTE_VIDEO")
        .srcObject =
        null;
    }

    if ($("PM_LOCAL_VIDEO")) {

      $("PM_LOCAL_VIDEO")
        .srcObject =
        null;
    }

    if ($("PM_CALL_STATUS")) {

      $("PM_CALL_STATUS")
        .textContent =
        "";
    }

    if ($("PM_CALL")) {

      $("PM_CALL")
        .classList
        .add(
          "pm-hidden"
        );
    }
  }

  if ($("PM_END_CALL")) {

    $("PM_END_CALL").onclick =
      function () {

        endCall(true);
      };
  }

  /* ============================================================
     MUTE
     ============================================================ */

  if ($("PM_MUTE")) {

    $("PM_MUTE").onclick =
      function () {

        if (!localStream) {
          return;
        }

        var audio =
          localStream
            .getAudioTracks()[0];

        if (audio) {

          audio.enabled =
            !audio.enabled;
        }
      };
  }

  /* ============================================================
     CAMERA
     ============================================================ */

  if ($("PM_CAMERA")) {

    $("PM_CAMERA").onclick =
      function () {

        if (!localStream) {
          return;
        }

        var video =
          localStream
            .getVideoTracks()[0];

        if (video) {

          video.enabled =
            !video.enabled;
        }
      };
  }

  /* ============================================================
     INITIALIZE EXTRA UI
     ============================================================ */

  setTimeout(
    function () {

      injectExtraButtons();

    },
    800
  );

})();
